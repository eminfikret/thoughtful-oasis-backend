stages:
  - lint
  - test
  - build
  - local-api-tests
  - deploy

variables:
  POSTGRES_DB: test_db
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_HOST: postgres

services:
  - postgres:15

lint:
  stage: lint
  image: python:3.11-slim
  before_script:
    - pip install ruff
  script:
    - ruff check .
  cache:
    paths:
      - ~/.cache/pip/
      - .ruff_cache/

lint-image:
  stage: build
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE/lint:latest -f docker/Dockerfile.lint .
    - docker push $CI_REGISTRY_IMAGE/lint:latest
  only:
    - main
    - tags

test:
  stage: test
  image: python:3.11-slim
  variables:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    DJANGO_SETTINGS_MODULE: core.settings
  before_script:
    - pip install -r requirements.txt
    - python manage.py migrate
  script:
    - python manage.py test

build:
  stage: build
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA -f docker/Dockerfile .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA

local-api-tests:
  stage: local-api-tests
  image: python:3.11
  services:
    - postgres:15
  variables:
    POSTGRES_PORT: 5432
    DJANGO_SETTINGS_MODULE: core.settings
    BACKEND_API_URL: "http://localhost:8000/api/v1"
  before_script:
    - pip install -r requirements.txt pytest requests
    - python manage.py migrate
    - python manage.py runserver 0.0.0.0:8000 &
    - sleep 5
    - curl --retry 3 --retry-connrefused --retry-delay 2 http://localhost:8000/api/v1/ || curl --retry 3 --retry-connrefused --retry-delay 2 http://localhost:8000/swagger/
  script:
    - pytest tests/api/
  after_script:
    - pkill -f "python manage.py runserver" || true

deploy:
  stage: deploy
  image:
    name: hashicorp/terraform:latest
    entrypoint: [""]
  before_script:
    - cd infra
    - terraform init
      -reconfigure
      -backend-config="address=https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE}"
      -backend-config="lock_address=https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE}/lock"
      -backend-config="unlock_address=https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE}/lock"
      -backend-config="lock_method=POST"
      -backend-config="unlock_method=DELETE"
      -backend-config="username=gitlab-ci-token"
      -backend-config="password=${TF_CONFIG_PASSWORD}"
  script:
    - terraform apply -auto-approve
    - export LOAD_BALANCER_DNS=$(terraform output -raw load_balancer_url)
    - echo "LOAD_BALANCER_DNS=$LOAD_BALANCER_DNS" > $CI_PROJECT_DIR/build.env
  artifacts:
    reports:
      dotenv: build.env
  variables:
    TF_STATE: "thoughtful-backend-${CI_COMMIT_REF_NAME}"
    TF_VAR_node_env: $CI_COMMIT_REF_NAME
    TF_VAR_ci_deploy_user: $CI_DEPLOY_USERNAME
    TF_VAR_ci_deploy_password: $CI_DEPLOY_PASSWORD
    TF_VAR_ci_registry: $CI_REGISTRY
    TF_VAR_ci_registry_image: $CI_REGISTRY_IMAGE
    TF_VAR_ci_commit_short_sha: $CI_COMMIT_SHORT_SHA
    TF_VAR_db_user: $DB_USER
    TF_VAR_db_password: $DB_PASSWORD
  only:
    - main

