stages:
  - lint
  - test
  - build
  - local-api-tests
  - deploy

variables:
  POSTGRES_DB: test_db
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_HOST: postgres

services:
  - postgres:15

lint:
  stage: lint
  image: python:3.11-slim
  before_script:
    - pip install ruff
  script:
    - ruff check .
  cache:
    paths:
      - ~/.cache/pip/
      - .ruff_cache/

lint-image:
  stage: build
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE/lint:latest -f docker/Dockerfile.lint .
    - docker push $CI_REGISTRY_IMAGE/lint:latest
  only:
    - main
    - tags

test:
  stage: test
  image: python:3.11-slim
  variables:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    DJANGO_SETTINGS_MODULE: core.settings
  before_script:
    - pip install -r requirements.txt
    - python manage.py migrate
  script:
    - python manage.py test

build:
  stage: build
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA -f docker/Dockerfile .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA

local-api-tests:
  stage: local-api-tests
  image: python:3.11
  services:
    - postgres:15
  variables:
    POSTGRES_DB: test_db
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    DJANGO_SETTINGS_MODULE: core.settings
    BACKEND_API_URL: "http://localhost:8000/api/v1"
  before_script:
    - pip install -r requirements.txt
    - pip install pytest requests
    - python manage.py migrate
    - python manage.py runserver 0.0.0.0:8000 &
    - SERVER_PID=$!
    - |
      echo "Waiting for API to be ready..."
      timeout=30
      counter=0
      while [ $counter -lt $timeout ]; do
        if curl -s http://localhost:8000/api/v1/ > /dev/null 2>&1 || curl -s http://localhost:8000/swagger/ > /dev/null 2>&1; then
          echo "API is ready!"
          break
        fi
        echo "API not ready yet, waiting... ($counter/$timeout)"
        sleep 1
        counter=$((counter+1))
      done
      if [ $counter -eq $timeout ]; then
        echo "API failed to start within timeout period"
        exit 1
      fi
  script:
    - pytest tests/api/
  after_script:
    - if [ -n "$SERVER_PID" ]; then kill $SERVER_PID || true; fi

deploy:
  stage: deploy
  image: alpine:latest
  script:
    - echo "Deploying to production server"
  only:
    - main