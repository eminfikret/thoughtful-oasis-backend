services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=fact_check_db
    ports:
      - "5432:5432"
    networks:
      - app-network

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ..:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - SEED_DATABASE=true
    depends_on:
      - db
    networks:
      - app-network

  lint:
    build:
      context: ..
      dockerfile: docker/Dockerfile.lint
    volumes:
      - ..:/app

networks:
  app-network:

volumes:
  postgres_data: